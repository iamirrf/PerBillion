server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ "^/assets/.*-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 7d;
    }

    location /fonts/ {
        expires 30d;
    }
}
