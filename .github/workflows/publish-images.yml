name: Publish Cloud Run images

on:
  push:
    branches: [codex/perbillion-release]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            target: cloudrun
          - service: api-gateway
            target: production
          - service: spring-orchestrator
            target: ''
          - service: ml-engine
            target: ''
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/iamirrf/perbillion-${{ matrix.service }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/iamirrf/PerBillion
